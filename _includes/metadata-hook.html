<!--
  글꼴 (assets/css/jekyll-theme-chirpy.scss 의 --font-ko / --font-mono 에서 적용)
  - 본문·제목: SUIT Variable 2.0.5
  - 고정폭(코드·날짜·메뉴): D2Coding, 자주 쓰는 한글 2,350자 subset. 한글도 고정폭이라 코드 속 한글 칸이 맞음
    (저장소에 버전 태그가 없어서 커밋으로 고정)

  무결성 검사(integrity): 이 파일에서 불러오는 CDN 파일은 모두 버전이 고정돼 있어서, 받은 내용이 아래 해시와 다르면
  브라우저가 쓰지 않음 (CDN 이 바뀌거나 변조돼도 안전). 버전을 올릴 때는 해시도 다시 계산해야 함:
    curl -s <주소> | openssl dgst -sha384 -binary | openssl base64 -A   → 앞에 sha384- 를 붙임
  갈무리 글꼴 해시는 assets/js/block-mode.js 에도 같은 값이 있음
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css"
  integrity="sha384-pHEDKB8KMOpnOqEjHZEW9SNi5EPKbCfvJgnPn+CNVZJFwvog5R8rd9K86GRnw4cw"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/wan2land/d2coding@e2659bacb50fd3e5f81b1beededb73ffebda134d/d2coding-subset.css"
  integrity="sha384-/aGOjRgXetckwYWTzGw1zfJJPlG4ZNUhc+ntpCY45ZqFXbKWXJQyg4WlSYt5Aghw"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
>

<!--
  다음 페이지 미리 받기 (Speculation Rules, Chrome·Edge. 지원 안 하는 브라우저는 무시함):
  사이트 안 링크에 마우스를 잠깐 올리거나 누르기 시작하면 그 페이지를 미리 받아 둬서 넘어갈 때 바로 뜸.
  그림·첨부 파일(/assets/)은 제외. 미리 그려 두기(prerender)까지는 하지 않음: 등장 연출이 보이지 않는 곳에서 먼저 끝나 버림
-->
<script type="speculationrules">
  {
    "prefetch": [
      {
        "where": {
          "and": [
            { "href_matches": "/*" },
            { "not": { "href_matches": "/assets/*" } }
          ]
        },
        "eagerness": "moderate"
      }
    ]
  }
</script>

<!--
  anime.js 등장 연출 (assets/js/intro.js). 아래 인라인 스크립트는 화면을 그리기 전에 어떤 연출을 할지 정해서
  연출할 요소를 미리 숨김(깜빡임 방지):
  - intro-sidebar: 이 창(탭)에서 처음 보는 페이지일 때 사이드바 트리
  - intro-home: 사이트 밖에서 들어왔을 때 홈 배너 타이핑과 글 카드
  - intro-post: 글 페이지마다 부제·날짜·작성자 줄
  스크립트를 못 불러와도 3초 뒤에는 숨김을 풀어서 내용이 그대로 보임
-->
<script>
  (function () {
    var root = document.documentElement;
    var fromSite = false;
    try {
      fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
    } catch (e) {}
    try {
      if (!sessionStorage.getItem('sb-intro')) {
        sessionStorage.setItem('sb-intro', '1');
        root.classList.add('intro-sidebar');
      }
    } catch (e) {}
    if (!fromSite) {
      root.classList.add('intro-home');
    }
    {%- if page.layout == 'post' %}
    root.classList.add('intro-post');
    {%- endif %}
    root.classList.add('layout-{{ page.layout | default: "none" }}');
    setTimeout(function () {
      root.classList.remove('intro-sidebar', 'intro-home', 'intro-post');
    }, 3000);

    try {
      var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      if (nav && nav.type === 'reload') {
        sessionStorage.removeItem('block-mode');
      } else if (sessionStorage.getItem('block-mode') === '1') {
        root.classList.add('block-mode');
        var font = document.createElement('link');
        font.id = 'galmuri-css';
        font.rel = 'stylesheet';
        font.integrity = 'sha384-55uQGdclWjXwWY0yHikdtcfcat9pPBqMBCVFIeWjRhvPPUYbpJLhIJegzTcFoh/A';
        font.crossOrigin = 'anonymous';
        font.referrerPolicy = 'no-referrer';
        font.href = 'https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css';
        document.head.appendChild(font);
      }
    } catch (e) {}
  })();
</script>
<script
  src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"
  integrity="sha384-InMmvD3VoYcY7hGjSC80aLb2bNNE4CzpX+Eq6FVDlmB0IKgDvmfPw4UY8L/M++iG"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
  defer
></script>
<script src="{{ '/assets/js/intro.js' | relative_url }}" defer></script>
<!-- 블록 모드 이스터에그 (소개 탭 마인크래프트 타일). 켜져 있으면 위 스크립트가 html.block-mode 와 갈무리 글꼴을 미리 붙이고, 새로고침이면 끔 -->
<script src="{{ '/assets/js/block-mode.js' | relative_url }}" defer></script>

<!--
  페이지 전환: 글 페이지의 제목·썸네일 이름 (전환 규칙은 assets/css/jekyll-theme-chirpy.scss).
  홈 카드(_layouts/home.html)·카테고리 목록(_layouts/category-tab.html)과 같은 이름이라 그 자리에서 이어지듯 움직임
-->
{% if page.layout == 'post' %}
  <style>
    article header h1 {
      view-transition-name: vt-title-{{ page.url | slugify }};
    }

    article header .preview-img {
      view-transition-name: vt-img-{{ page.url | slugify }};
      view-transition-class: vt-thumb;
    }
  </style>
{% endif %}

<!--
  PWA 자동 업데이트: 배포로 새 서비스 워커가 대기 중이면 업데이트 버튼을 누르지 않아도 바로 적용함.
  적용되면 테마(app.min.js)가 controllerchange 때 페이지를 한 번 새로고침해서 새 글이 보임

  새 판을 알아채는 시점: 페이지를 열 때마다 서비스 워커를 updateViaCache: 'none' 으로 다시 등록해서 바로 확인함.
  테마는 기본값(imports)으로 등록하는데, 그러면 배포마다 바뀌는 설정 파일(assets/js/data/swconf.js)을
  브라우저 캐시(GitHub Pages 는 10분)에서 읽어서, 배포 뒤 최대 10분 동안은 새로고침해도 이전 판이 그대로 보였음
  (_config.yml 에서 pwa.cache.enabled 를 끄면 테마가 서비스 워커를 지우므로, 그때는 여기서도 등록하지 않음)
-->
{% if site.pwa.enabled and site.pwa.cache.enabled %}
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{{ "/sw.min.js" | relative_url }}', { updateViaCache: 'none' }).then(function (reg) {
        function skipWaiting() {
          if (reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage('SKIP_WAITING');
        }
        skipWaiting();
        reg.addEventListener('updatefound', function () {
          if (reg.installing) reg.installing.addEventListener('statechange', skipWaiting);
        });
      });
    }
  </script>
{% endif %}
