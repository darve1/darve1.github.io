<!--
  글꼴 (assets/css/jekyll-theme-chirpy.scss 의 --font-ko / --font-mono 에서 적용)
  - 본문·제목: SUIT Variable 2.0.5
  - 고정폭(코드·날짜·메뉴): D2Coding, 자주 쓰는 한글 2,350자 subset. 한글도 고정폭이라 코드 속 한글 칸이 맞음
    (저장소에 버전 태그가 없어서 커밋으로 고정)
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/wan2land/d2coding@e2659bacb50fd3e5f81b1beededb73ffebda134d/d2coding-subset.css"
>

<!--
  anime.js 등장 연출 (assets/js/intro.js). 아래 인라인 스크립트는 화면을 그리기 전에 어떤 연출을 할지 정해서
  연출할 요소를 미리 숨김(깜빡임 방지):
  - intro-sidebar: 이 창(탭)에서 처음 보는 페이지일 때 사이드바 트리
  - intro-home: 사이트 밖에서 들어왔을 때 홈 배너 타이핑과 글 카드
  - intro-post: 글 페이지마다 부제·날짜·작성자 줄
  스크립트를 못 불러와도 3초 뒤에는 숨김을 풀어서 내용이 그대로 보임
-->
<script>
  (function () {
    var root = document.documentElement;
    var fromSite = false;
    try {
      fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
    } catch (e) {}
    try {
      if (!sessionStorage.getItem('sb-intro')) {
        sessionStorage.setItem('sb-intro', '1');
        root.classList.add('intro-sidebar');
      }
    } catch (e) {}
    if (!fromSite) {
      root.classList.add('intro-home');
    }
    {%- if page.layout == 'post' %}
    root.classList.add('intro-post');
    {%- endif %}
    root.classList.add('layout-{{ page.layout | default: "none" }}');
    setTimeout(function () {
      root.classList.remove('intro-sidebar', 'intro-home', 'intro-post');
    }, 3000);

    try {
      var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      if (nav && nav.type === 'reload') {
        sessionStorage.removeItem('block-mode');
      } else if (sessionStorage.getItem('block-mode') === '1') {
        root.classList.add('block-mode');
        var font = document.createElement('link');
        font.id = 'galmuri-css';
        font.rel = 'stylesheet';
        font.href = 'https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css';
        document.head.appendChild(font);
      }
    } catch (e) {}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="{{ '/assets/js/intro.js' | relative_url }}" defer></script>
<!-- 블록 모드 이스터에그 (소개 탭 마인크래프트 타일). 켜져 있으면 위 스크립트가 html.block-mode 와 갈무리 글꼴을 미리 붙이고, 새로고침이면 끔 -->
<script src="{{ '/assets/js/block-mode.js' | relative_url }}" defer></script>

<!--
  페이지 전환: 글 페이지의 제목·썸네일 이름 (전환 규칙은 assets/css/jekyll-theme-chirpy.scss).
  홈 카드(_layouts/home.html)·카테고리 목록(_layouts/category-tab.html)과 같은 이름이라 그 자리에서 이어지듯 움직임
-->
{% if page.layout == 'post' %}
  <style>
    article header h1 {
      view-transition-name: vt-title-{{ page.url | slugify }};
    }

    article header .preview-img {
      view-transition-name: vt-img-{{ page.url | slugify }};
      view-transition-class: vt-thumb;
    }
  </style>
{% endif %}
